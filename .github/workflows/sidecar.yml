name: Sidecar (Bun)

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bun-sidecar

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        # bun-sidecar/bun.lock 一直在库里，但这条此前没加 --frozen-lockfile，
        # 于是 CI 每次按 package.json 的范围重新解析（家族包 ^0.99.0 会漂）。
        run: bun install --frozen-lockfile

      # 引擎边界的编译期断层面。此前**没有任何 workflow 跑 tsc**，所以
      # kernel/types.ts 从 pi-coding-agent import 了它并不导出的 `Model`
      # 红了数周没人看见（纯类型 import 会被擦除，运行时与测试都察觉不到）。
      # 这里是 0 错误硬门槛，与根目录 scripts/check-type-budget.mjs 的棘轮并行。
      - name: Typecheck (engine boundary)
        run: bun x tsc --noEmit

      # 覆盖率只跑一次，结果落盘给下一步复用；测试失败时把表打出来再退出。
      - name: Run Bun tests with coverage
        run: bun test --coverage > coverage.txt 2>&1 || { cat coverage.txt; exit 1; }

      # 判据本体在 scripts/check-core-coverage.sh（与本地 gate 共用同一实现，
      # 避免"CI 修了、本地没修"这种双实现漂移）。COV-PASS-001 的完整来龙去脉见脚本注释。
      - name: Enforce core module coverage threshold (>= 65% lines)
        shell: bash
        run: bash ../scripts/check-core-coverage.sh coverage.txt 65
