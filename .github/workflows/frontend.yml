name: Frontend

on: [push, pull_request]

jobs:
  typecheck-build-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build (vite build)
        run: npm run build

      - name: Brand color guard (no hardcoded colors)
        run: node scripts/check-hardcoded-colors.mjs

      - name: Spacing guard (no text touching its own border)
        run: node scripts/check-spacing.mjs
