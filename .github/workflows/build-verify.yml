name: Build Verify

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  bun-bundle-build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - name: Build the Bun backend bundle (server.js + runtime)
        shell: cmd
        env:
          MAXMA_CI: "1"
        run: call build\build-server.bat

      - name: Verify bundle artifacts
        shell: powershell
        run: |
          foreach ($f in @("dist\bun-server\server.js", "dist\bun-server\bun.exe", "dist\bun-server\node_modules\sharp")) {
            if (-not (Test-Path $f)) { Write-Error "Missing build artifact: $f"; exit 1 }
          }
          Write-Host "Bun bundle artifacts verified."

      - name: Smoke test the bundle (start + core endpoints)
        shell: powershell
        run: .\build\smoke-test-server.ps1 -Port 8000
