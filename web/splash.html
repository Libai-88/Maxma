<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MaxmaHere Splash" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self';" />
  <title>MaxmaHere</title>
  <style>
    html { background: oklch(0.16 0 0); color-scheme: dark; }
    body {
      margin: 0; display: flex; align-items: center; justify-content: center;
      height: 100vh; border-radius: 12px;
      font-family: 'Geist Variable', ui-sans-serif, system-ui, sans-serif;
      background: oklch(0.16 0 0);
      -webkit-app-region: drag; user-select: none;
    }
    .splash-pane {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      padding: 32px 40px; border-radius: 16px;
      background: oklch(0.985 0.003 265 / 6%);
      border: 1px solid oklch(1 0 0 / 10%);
      box-shadow: inset 0 1px 0 oklch(1 0 0 / 14%), 0 12px 40px oklch(0 0 0 / 40%);
      animation: fadeInUp 0.8s ease-out both;
    }
    .splash-mark { width: 40px; height: 40px; border-radius: 10px; background: oklch(0.9 0 0 / 85%); animation: breathe 3s ease-in-out infinite; }
    .splash-text { font-size: 14px; letter-spacing: 0.14em; color: oklch(0.985 0 0 / 90%); }
    .splash-tagline { font-size: 11px; letter-spacing: 0.12em; color: oklch(0.985 0 0 / 45%); }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes breathe { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .splash-pane, .splash-mark { animation: none; } }
  </style>
</head>
<body>
  <div class="splash-pane">
    <div class="splash-mark"></div>
    <div class="splash-text">MaxmaHere</div>
    <div class="splash-tagline">Agent workspace</div>
  </div>
</body>
</html>
