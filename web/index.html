<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/images/brand/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Maxma - AI 助手桌面应用" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws://localhost:* http://localhost:* ws://127.0.0.1:* http://127.0.0.1:*; img-src 'self' https: http://localhost:* http://127.0.0.1:* data: blob:; frame-src 'self';" />
    <title>Maxma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=LXGW+WenKai+Screen&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>请启用 JavaScript 以使用 Maxma。</noscript>
    <!-- SPLASH-BRAND-004：启动等待屏「墨色山水 · 月下灯火」——
         整屏即一幅夜景画，不做元素堆砌：月华当空、墨色山峦层叠、
         山脚小镇灯火次第亮起、水面倒影脉动、薄雾缓缓流动，
         星屑与微光在夜色中漂浮。文案如画上题字般融入画面。
         氛围即全部：安静、温柔、有人在等你。 -->
    <div id="app-loading" role="status" aria-label="正在启动">
      <!-- 整屏山水夜景（SVG 铺满，preserveAspectRatio slice 适配任意窗口） -->
      <svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#10162B" />
            <stop offset="45%" stop-color="#1D2140" />
            <stop offset="78%" stop-color="#2C2550" />
            <stop offset="100%" stop-color="#352A4E" />
          </linearGradient>
          <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0E1426" />
            <stop offset="100%" stop-color="#131B32" />
          </linearGradient>
          <radialGradient id="moon-halo" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#F5EBD8" stop-opacity="0.5" />
            <stop offset="35%" stop-color="#F5EBD8" stop-opacity="0.16" />
            <stop offset="100%" stop-color="#F5EBD8" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#C9C4D8" stop-opacity="0" />
            <stop offset="50%" stop-color="#C9C4D8" stop-opacity="0.10" />
            <stop offset="100%" stop-color="#C9C4D8" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#F5EBD8" stop-opacity="0.34" />
            <stop offset="100%" stop-color="#F5EBD8" stop-opacity="0" />
          </linearGradient>
        </defs>

        <!-- 夜空 -->
        <rect width="1600" height="900" fill="url(#night)" />

        <!-- 月华与柔光 -->
        <circle class="moon-halo" cx="1180" cy="205" r="240" fill="url(#moon-halo)" />
        <circle class="moon" cx="1180" cy="205" r="82" fill="#F5EBD8" />
        <circle class="moon-crater" cx="1152" cy="186" r="12" fill="#E6D8BE" opacity="0.5" />
        <circle class="moon-crater" cx="1206" cy="226" r="9" fill="#E6D8BE" opacity="0.4" />
        <circle class="moon-crater" cx="1164" cy="230" r="7" fill="#E6D8BE" opacity="0.35" />

        <!-- 远山（浅墨） -->
        <path d="M 0 560 C 180 510 340 520 500 480 C 660 440 810 470 980 448 C 1140 428 1330 458 1600 420 L 1600 900 L 0 900 Z" fill="#262E4E" />
        <!-- 中山（中墨） -->
        <path d="M 0 640 C 190 580 390 600 570 548 C 740 500 920 552 1100 510 C 1260 474 1430 516 1600 486 L 1600 900 L 0 900 Z" fill="#202847" />
        <!-- 近山（深墨，如泼墨） -->
        <path d="M 0 760 C 150 680 330 700 520 648 C 700 600 900 672 1080 620 C 1240 578 1430 646 1600 596 L 1600 900 L 0 900 Z" fill="#19203C" />

        <!-- 山间薄雾（缓缓流动） -->
        <rect class="mist mist-1" x="0" y="500" width="1600" height="90" fill="url(#mist)" />
        <rect class="mist mist-2" x="0" y="640" width="1600" height="70" fill="url(#mist)" />

        <!-- 小镇灯火：山脚次第亮起的暖灯 -->
        <g class="village">
          <circle class="lamp" cx="180" cy="640" r="2.2" fill="#FFD9A0" />
          <circle class="lamp" cx="212" cy="652" r="1.6" fill="#FFD9A0" style="animation-delay:0.6s" />
          <circle class="lamp" cx="238" cy="634" r="1.9" fill="#FFC98E" style="animation-delay:1.2s" />
          <circle class="lamp" cx="264" cy="648" r="1.4" fill="#FFD9A0" style="animation-delay:1.8s" />
          <circle class="lamp" cx="290" cy="640" r="2" fill="#FFD9A0" style="animation-delay:0.3s" />
          <circle class="lamp" cx="318" cy="652" r="1.5" fill="#FFC98E" style="animation-delay:2.1s" />
          <circle class="lamp" cx="346" cy="636" r="2.3" fill="#FFD9A0" style="animation-delay:1.5s" />
          <circle class="lamp" cx="560" cy="640" r="1.8" fill="#FFD9A0" />
          <circle class="lamp" cx="590" cy="630" r="2.1" fill="#FFC98E" style="animation-delay:0.9s" />
          <circle class="lamp" cx="618" cy="648" r="1.5" fill="#FFD9A0" style="animation-delay:1.4s" />
          <circle class="lamp" cx="648" cy="638" r="2" fill="#FFD9A0" style="animation-delay:2.4s" />
          <circle class="lamp" cx="676" cy="650" r="1.6" fill="#FFC98E" style="animation-delay:0.5s" />
          <circle class="lamp" cx="1100" cy="624" r="2" fill="#FFD9A0" />
          <circle class="lamp" cx="1128" cy="636" r="1.6" fill="#FFD9A0" style="animation-delay:1.1s" />
          <circle class="lamp" cx="1156" cy="626" r="2.2" fill="#FFC98E" style="animation-delay:1.7s" />
          <circle class="lamp" cx="1184" cy="640" r="1.5" fill="#FFD9A0" style="animation-delay:0.7s" />
          <circle class="lamp" cx="1212" cy="632" r="1.9" fill="#FFD9A0" style="animation-delay:2.6s" />
          <circle class="lamp" cx="1240" cy="644" r="1.4" fill="#FFC98E" style="animation-delay:1.3s" />
          <circle class="lamp" cx="1460" cy="618" r="2" fill="#FFD9A0" />
          <circle class="lamp" cx="1490" cy="632" r="1.7" fill="#FFD9A0" style="animation-delay:2s" />
          <circle class="lamp" cx="1518" cy="626" r="2.3" fill="#FFC98E" style="animation-delay:0.4s" />
          <circle class="lamp" cx="1546" cy="640" r="1.5" fill="#FFD9A0" style="animation-delay:1.9s" />
          <!-- 每盏灯下一点微光（光晕） -->
          <circle class="lamp-halo" cx="180" cy="640" r="5" fill="#FFD9A0" opacity="0.14" />
          <circle class="lamp-halo" cx="346" cy="636" r="6" fill="#FFD9A0" opacity="0.16" style="animation-delay:1.5s" />
          <circle class="lamp-halo" cx="1156" cy="626" r="6" fill="#FFC98E" opacity="0.16" style="animation-delay:1.7s" />
          <circle class="lamp-halo" cx="1518" cy="626" r="6" fill="#FFC98E" opacity="0.16" style="animation-delay:0.4s" />
        </g>

        <!-- 水面：月与灯火的倒影 -->
        <rect class="water" y="760" width="1600" height="140" fill="url(#water)" />
        <rect class="moon-reflection" x="1150" y="762" width="60" height="118" rx="30" fill="url(#reflection)" />
        <rect class="lamp-reflection" x="172" y="762" width="16" height="52" rx="8" fill="url(#reflection)" opacity="0.8" />
        <rect class="lamp-reflection" x="338" y="762" width="16" height="60" rx="8" fill="url(#reflection)" opacity="0.85" style="animation-delay:1.5s" />
        <rect class="lamp-reflection" x="1148" y="762" width="16" height="48" rx="8" fill="url(#reflection)" opacity="0.8" style="animation-delay:1.7s" />
        <rect class="lamp-reflection" x="1510" y="762" width="16" height="56" rx="8" fill="url(#reflection)" opacity="0.85" style="animation-delay:0.4s" />
        <rect class="lamp-reflection" x="582" y="762" width="14" height="44" rx="7" fill="url(#reflection)" opacity="0.7" style="animation-delay:0.9s" />
        <rect class="lamp-reflection" x="1120" y="762" width="14" height="40" rx="7" fill="url(#reflection)" opacity="0.7" style="animation-delay:1.1s" />
        <!-- 水面细波纹 -->
        <ellipse class="ripple" cx="1180" cy="810" rx="120" ry="3" fill="none" stroke="#F5EBD8" stroke-width="1" opacity="0.10" />
        <ellipse class="ripple" cx="1180" cy="836" rx="160" ry="3" fill="none" stroke="#F5EBD8" stroke-width="1" opacity="0.07" style="animation-delay:1.2s" />
      </svg>

      <!-- 漂浮的星屑微光（氛围光点，CSS 动画） -->
      <span class="dust dust-1" aria-hidden="true"></span>
      <span class="dust dust-2" aria-hidden="true"></span>
      <span class="dust dust-3" aria-hidden="true"></span>
      <span class="dust dust-4" aria-hidden="true"></span>
      <span class="dust dust-5" aria-hidden="true"></span>

      <!-- 文案：如画上题字，安静地融在夜色里 -->
      <div class="boot-copy">
        <p class="boot-title">Maxma</p>
        <p class="boot-slogan">墨色入夜 · 灯火可亲</p>
        <div class="boot-bar" aria-hidden="true"><span></span></div>
        <p class="boot-status"><span id="boot-status-text">正在点亮小公寓的灯</span><span class="boot-dots"><i>·</i><i>·</i><i>·</i></span></p>
        <p class="boot-hint">首次启动需要 10–30 秒</p>
      </div>
    </div>
    <style>
      #app-loading {
        position: fixed; inset: 0; z-index: 9999;
        font-family: 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', serif;
        overflow: hidden;
        background: #10162B; /* Canvas/JS 未就绪时的夜空底色 */
      }
      #splash-canvas {
        position: absolute; inset: 0;
        pointer-events: none;
      }
      /* 整屏山水画 */
      .scene {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
      }
      /* 电影感暗角 */
      #app-loading::after {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 92% 78% at 50% 44%, transparent 52%, rgba(8, 10, 22, 0.5) 100%);
      }

      /* ── 画面动画：一切都轻轻地动 ── */
      .moon-halo     { animation: halo-breathe 6s ease-in-out infinite; }
      .moon          { animation: moon-glow 6s ease-in-out infinite; transform-origin: 1180px 205px; }
      .mist-1        { animation: mist-drift 26s ease-in-out infinite; }
      .mist-2        { animation: mist-drift 34s ease-in-out -12s infinite; }
      .lamp          { animation: lamp-flicker 4.2s ease-in-out infinite; }
      .lamp-halo     { animation: lamp-flicker 4.2s ease-in-out infinite; }
      .moon-reflection, .lamp-reflection { animation: reflection-pulse 4.6s ease-in-out infinite; }
      .ripple        { animation: ripple-grow 7s ease-in-out infinite; }

      /* 星屑微光：缓慢飘落、明灭 */
      .dust {
        position: absolute; border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 236, 200, 0.9) 0%, rgba(255, 236, 200, 0) 70%);
        pointer-events: none;
        animation: dust-fall 12s linear infinite;
      }
      .dust-1 { width: 4px; height: 4px; left: 12%; top: -3%; animation-delay: 0s; }
      .dust-2 { width: 3px; height: 3px; left: 30%; top: -3%; animation-delay: 4s; animation-duration: 15s; }
      .dust-3 { width: 5px; height: 5px; left: 55%; top: -3%; animation-delay: 2.5s; animation-duration: 18s; }
      .dust-4 { width: 3px; height: 3px; left: 72%; top: -3%; animation-delay: 7s; animation-duration: 14s; }
      .dust-5 { width: 4px; height: 4px; left: 88%; top: -3%; animation-delay: 9.5s; animation-duration: 17s; }

      /* ── 文案：题字式排版，克制而留白 ── */
      .boot-copy {
        position: absolute; left: 0; right: 0; bottom: 11%;
        display: flex; flex-direction: column; align-items: center;
        text-align: center;
        pointer-events: none;
      }
      .boot-title {
        margin: 0 0 10px;
        font-size: 32px; font-weight: 600;
        letter-spacing: 0.38em; text-indent: 0.38em;
        color: rgba(245, 239, 228, 0.92);
        text-shadow: 0 2px 24px rgba(0, 0, 0, 0.5);
        animation: boot-fade-up 1s ease-out 0.15s both;
      }
      .boot-slogan {
        margin: 0 0 26px;
        font-size: 12.5px; letter-spacing: 0.52em; text-indent: 0.52em;
        color: rgba(232, 197, 138, 0.82);
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.45);
        animation: boot-fade-up 1s ease-out 0.3s both;
      }
      .boot-bar {
        width: 120px; height: 2px; margin-bottom: 18px;
        border-radius: 999px; background: rgba(245, 239, 228, 0.14);
        overflow: hidden;
      }
      .boot-bar span {
        display: block; width: 40%; height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(232, 197, 138, 0.45), #E8C58A, rgba(232, 197, 138, 0.45));
        box-shadow: 0 0 10px rgba(232, 197, 138, 0.6);
        animation: boot-slide 1.6s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .boot-status {
        margin: 0; font-size: 12.5px; color: rgba(216, 210, 196, 0.75); letter-spacing: 0.22em; text-indent: 0.22em;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
      }
      .boot-dots i {
        font-style: normal;
        animation: boot-dot 1.4s ease-in-out infinite;
      }
      .boot-dots i:nth-child(2) { animation-delay: 0.2s; }
      .boot-dots i:nth-child(3) { animation-delay: 0.4s; }
      .boot-hint {
        margin: 12px 0 0; font-size: 11px; color: rgba(138, 129, 150, 0.65); letter-spacing: 0.14em; text-indent: 0.14em;
      }

      @keyframes halo-breathe {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50%      { opacity: 1; transform: scale(1.06); }
      }
      @keyframes moon-glow {
        0%, 100% { opacity: 0.92; }
        50%      { opacity: 1; }
      }
      @keyframes mist-drift {
        0%, 100% { transform: translateX(-2.5%); opacity: 0.8; }
        50%      { transform: translateX(2.5%); opacity: 1; }
      }
      @keyframes lamp-flicker {
        0%, 100% { opacity: 0.75; }
        30%      { opacity: 1; }
        55%      { opacity: 0.85; }
        80%      { opacity: 1; }
      }
      @keyframes reflection-pulse {
        0%, 100% { opacity: 0.55; }
        50%      { opacity: 1; }
      }
      @keyframes ripple-grow {
        0%   { opacity: 0; transform: scaleX(0.4); }
        40%  { opacity: 0.14; }
        100% { opacity: 0; transform: scaleX(1.15); }
      }
      @keyframes dust-fall {
        0%   { transform: translateY(0) translateX(0); opacity: 0; }
        8%   { opacity: 0.7; }
        60%  { opacity: 0.45; }
        100% { transform: translateY(105vh) translateX(26px); opacity: 0; }
      }
      @keyframes boot-fade-up {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes boot-slide {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(360%); }
      }
      @keyframes boot-dot {
        0%, 100% { opacity: 0.25; } 50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loading .moon-halo,
        #app-loading .moon,
        #app-loading .mist-1, #app-loading .mist-2,
        #app-loading .lamp, #app-loading .lamp-halo,
        #app-loading .moon-reflection, #app-loading .lamp-reflection,
        #app-loading .ripple,
        #app-loading .dust,
        #app-loading .boot-bar span,
        #app-loading .boot-dots i,
        #app-loading .boot-title,
        #app-loading .boot-slogan { animation: none !important; opacity: 1 !important; }
      }
    </style>
    <div id="app"></div>
    <script type="module" src="/splash.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
