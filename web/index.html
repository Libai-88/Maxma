<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/images/brand/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Maxma - AI 助手桌面应用" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws://localhost:* http://localhost:* ws://127.0.0.1:* http://127.0.0.1:*; img-src 'self' https: http://localhost:* http://127.0.0.1:* data: blob:; frame-src 'self';" />
    <title>Maxma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=LXGW+WenKai+Screen&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>请启用 JavaScript 以使用 Maxma。</noscript>
    <!-- SPLASH-BRAND-003：启动等待屏「灯下待你」——
         全屏 Canvas 星空动画（splash.js：星闪/流星/萤火虫/窗户光晕脉动），
         中央为暖光小窗插画（Maxma 的猫趴在窗台等你），「玛」字朱砂印落款。
         深色夜空 + 暖光窗 = 品牌「墨色」与陪伴感的融合。 -->
    <div id="app-loading" role="status" aria-label="正在启动">
      <div class="boot-seal-wrap" aria-hidden="true">
        <div class="boot-seal">玛</div>
      </div>
      <p class="boot-title">Maxma</p>
      <p class="boot-slogan">墨色入夜 · 灯火可亲</p>

      <svg class="boot-window" viewBox="0 0 320 240" aria-hidden="true">
        <defs>
          <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFEDC2" />
            <stop offset="70%" stop-color="#FFD98E" />
            <stop offset="100%" stop-color="#FFC46B" />
          </linearGradient>
          <clipPath id="pane2">
            <rect x="30" y="26" width="260" height="184" rx="6" />
          </clipPath>
        </defs>

        <!-- 窗框（深木色，暖光从内透出） -->
        <rect x="10" y="8" width="300" height="224" rx="16" fill="#4A3422" />
        <rect x="17" y="15" width="286" height="210" rx="12" fill="#3A2819" />

        <!-- 窗内：暖光房间 -->
        <g clip-path="url(#pane2)">
          <rect class="room-light" x="30" y="26" width="260" height="184" fill="url(#room)" />
          <!-- 窗格 -->
          <rect x="158" y="26" width="4" height="184" fill="#573F2A" />
          <rect x="30" y="114" width="260" height="4" fill="#573F2A" />
          <!-- 窗帘 -->
          <path class="curtain curtain-l" d="M 30 26 C 58 38 62 84 54 130 C 48 168 52 208 46 210 L 30 210 Z" fill="#7A4E38" opacity="0.92" />
          <path class="curtain curtain-r" d="M 290 26 C 262 38 258 84 266 130 C 272 168 268 208 274 210 L 290 210 Z" fill="#7A4E38" opacity="0.92" />
          <!-- 窗台上：猫剪影趴着等主人 -->
          <g class="cat" fill="#33261E">
            <ellipse cx="172" cy="188" rx="38" ry="13" />
            <circle cx="128" cy="176" r="12" />
            <path d="M 118 166 L 122 154 L 130 165 Z" />
            <path d="M 130 165 L 139 155 L 139 168 Z" />
            <path class="cat-tail" d="M 206 186 C 224 184 230 171 223 162 C 217 156 208 158 210 164" fill="none" stroke="#33261E" stroke-width="5" stroke-linecap="round" />
            <circle cx="123" cy="174" r="1.5" fill="#FFE9BC" />
            <circle cx="132" cy="174" r="1.5" fill="#FFE9BC" />
          </g>
          <!-- 暖光下的小物件：一杯热茶（温度感） -->
          <g class="tea">
            <rect x="228" y="196" width="26" height="10" rx="3" fill="#FFFFFF" opacity="0.9" />
            <path d="M 254 199 C 260 197 260 205 254 203" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9" />
            <path class="steam" d="M 238 192 C 235 186 242 184 238 178" fill="none" stroke="#FFF7E0" stroke-width="1.6" stroke-linecap="round" opacity="0.7" />
            <path class="steam steam-2" d="M 246 192 C 243 186 250 184 246 178" fill="none" stroke="#FFF7E0" stroke-width="1.6" stroke-linecap="round" opacity="0.7" />
          </g>
        </g>

        <!-- 「玛」字朱砂印（贴在窗内右上角） -->
        <g class="seal-stamp">
          <rect x="244" y="34" width="30" height="30" rx="6" fill="#C23B22" />
          <text x="259" y="56" font-family="'Songti SC','STSong','Noto Serif SC',serif" font-size="16" font-weight="700" fill="#FBF7F0" text-anchor="middle">玛</text>
        </g>

        <!-- 窗台 -->
        <rect x="10" y="210" width="300" height="18" rx="8" fill="#4A3422" />
        <rect x="10" y="210" width="300" height="4" rx="2" fill="#5C4229" />
      </svg>

      <div class="boot-bar" aria-hidden="true"><span></span></div>
      <p class="boot-status"><span id="boot-status-text">正在点亮小公寓的灯</span><span class="boot-dots"><i>·</i><i>·</i><i>·</i></span></p>
      <p class="boot-hint">首次启动需要 10–30 秒</p>
    </div>
    <style>
      #app-loading {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        /* Canvas 未就绪时的深色兜底背景（与 splash.js 夜空渐变一致） */
        background: linear-gradient(180deg, #181D30 0%, #211E3A 55%, #33264A 85%, #3A2B45 100%);
        font-family: 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', serif;
        overflow: hidden;
      }
      #splash-canvas {
        position: absolute; inset: 0;
        pointer-events: none;
      }
      /* 顶部朱砂细线（品牌点睛） */
      #app-loading::after {
        content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
        width: 64px; height: 3px; border-radius: 0 0 2px 2px;
        background: linear-gradient(90deg, transparent, #C23B22 30%, #C23B22 70%, transparent);
        opacity: 0.9;
      }

      /* ── 玛字朱砂印 ── */
      .boot-seal-wrap {
        margin-bottom: 14px;
        animation: boot-seal-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .boot-seal {
        width: 46px; height: 46px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(145deg, #D24830 0%, #C23B22 55%, #A9321C 100%);
        color: #FBF7F0;
        font-size: 23px; font-weight: 700; line-height: 1;
        border-radius: 9px;
        box-shadow:
          0 2px 12px rgba(194, 59, 34, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.22),
          inset 0 -2px 4px rgba(120, 25, 10, 0.3);
        animation: boot-breathe 3s cubic-bezier(0.37, 0, 0.63, 1) 0.6s infinite;
      }
      .boot-title {
        margin: 0 0 5px; font-size: 24px; font-weight: 900;
        letter-spacing: 4px; color: #F5EFE4;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
        animation: boot-fade-up 0.8s ease-out 0.1s both;
      }
      .boot-slogan {
        margin: 0 0 20px; font-size: 12px; letter-spacing: 5px;
        color: #E8C58A;
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.4);
        animation: boot-fade-up 0.8s ease-out 0.2s both;
      }

      /* ── 暖光小窗（SVG 插画） ── */
      .boot-window {
        width: 288px; height: auto; margin-bottom: 22px;
        filter: drop-shadow(0 0 34px rgba(255, 176, 92, 0.38))
                drop-shadow(0 18px 40px rgba(0, 0, 0, 0.5));
        animation: boot-window-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
      }
      .boot-window .room-light { animation: light-breathe 3.4s ease-in-out infinite; }
      .boot-window .curtain-l  { transform-origin: 30px 26px; animation: curtain-sway 6s ease-in-out infinite; }
      .boot-window .curtain-r  { transform-origin: 290px 26px; animation: curtain-sway 6s ease-in-out 3s infinite; }
      .boot-window .cat-tail   { transform-origin: 206px 186px; animation: tail-sway 3.2s ease-in-out infinite; }
      .boot-window .steam     { animation: steam-rise 2.6s ease-in-out infinite; opacity: 0; }
      .boot-window .steam-2   { animation-delay: 1.3s; }
      .boot-window .seal-stamp{ animation: stamp-in 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.9s both; }

      /* ── 进度条（金色流光） ── */
      .boot-bar {
        width: 148px; height: 2px; margin-bottom: 16px;
        border-radius: 999px; background: rgba(245, 239, 228, 0.12);
        overflow: hidden;
      }
      .boot-bar span {
        display: block; width: 38%; height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(232, 197, 138, 0.5), #E8C58A, rgba(232, 197, 138, 0.5));
        box-shadow: 0 0 8px rgba(232, 197, 138, 0.55);
        animation: boot-slide 1.5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .boot-status {
        margin: 0; font-size: 13px; color: #D8D2C4; letter-spacing: 1px;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
      }
      .boot-dots i {
        font-style: normal;
        animation: boot-dot 1.4s ease-in-out infinite;
      }
      .boot-dots i:nth-child(2) { animation-delay: 0.2s; }
      .boot-dots i:nth-child(3) { animation-delay: 0.4s; }
      .boot-hint {
        margin: 12px 0 0; font-size: 11px; color: #8A8196; letter-spacing: 0.5px;
      }

      @keyframes boot-seal-in {
        from { opacity: 0; transform: scale(0.55) rotate(-8deg); }
        to   { opacity: 1; transform: scale(1) rotate(0deg); }
      }
      @keyframes boot-breathe {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.05); }
      }
      @keyframes boot-fade-up {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes boot-window-in {
        from { opacity: 0; transform: translateY(16px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes boot-slide {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(360%); }
      }
      @keyframes boot-dot {
        0%, 100% { opacity: 0.25; } 50% { opacity: 1; }
      }
      @keyframes light-breathe {
        0%, 100% { opacity: 0.88; }
        50%      { opacity: 1; }
      }
      @keyframes curtain-sway {
        0%, 100% { transform: rotate(0deg); }
        50%      { transform: rotate(1.4deg); }
      }
      @keyframes tail-sway {
        0%, 100% { transform: rotate(0deg); }
        50%      { transform: rotate(7deg); }
      }
      @keyframes steam-rise {
        0%   { opacity: 0; transform: translateY(6px); }
        35%  { opacity: 0.75; }
        100% { opacity: 0; transform: translateY(-10px); }
      }
      @keyframes stamp-in {
        from { opacity: 0; transform: scale(0.4) rotate(-14deg); }
        to   { opacity: 1; transform: scale(1) rotate(0deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loading .boot-seal-wrap,
        #app-loading .boot-seal,
        #app-loading .boot-window,
        #app-loading .boot-bar span,
        #app-loading .boot-dots i,
        #app-loading .boot-title,
        #app-loading .boot-slogan,
        #app-loading .boot-window * { animation: none !important; opacity: 1 !important; }
      }
    </style>
    <div id="app"></div>
    <script type="module" src="/splash.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
