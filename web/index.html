<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/images/brand/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Maxma - AI 助手桌面应用" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws://localhost:* http://localhost:* ws://127.0.0.1:* http://127.0.0.1:*; img-src 'self' https: http://localhost:* http://127.0.0.1:* data: blob:; frame-src 'self';" />
    <title>Maxma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=LXGW+WenKai+Screen&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>请启用 JavaScript 以使用 Maxma。</noscript>
    <!-- SPLASH-BRAND-002：启动等待屏「灯下待你」——
         Aurora 暖色光斑（借鉴 inspira AuroraBackground 的漂浮动画）+ 
         SVG 插画「小公寓的窗」：窗外夜空/月牙/流星，窗内暖灯/窗帘，
         窗台上趴着 Maxma 的猫剪影（呼应"Maxma 正趴在桌上等你"），
         窗内右上角为「玛」字朱砂印。全部 CSS/SVG 实现，离线可用。 -->
    <div id="app-loading" role="status" aria-label="正在启动">
      <div class="boot-aurora" aria-hidden="true">
        <span class="aurora-beam beam-1"></span>
        <span class="aurora-beam beam-2"></span>
        <span class="aurora-beam beam-3"></span>
      </div>
      <div class="boot-seal-wrap" aria-hidden="true">
        <div class="boot-seal">玛</div>
      </div>
      <p class="boot-title">Maxma</p>
      <p class="boot-slogan">墨色入夜 · 灯火可亲</p>

      <svg class="boot-window" viewBox="0 0 320 264" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#232A3E" />
            <stop offset="100%" stop-color="#3A3350" />
          </linearGradient>
          <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFE3AC" stop-opacity="0.95" />
            <stop offset="100%" stop-color="#FFC46B" stop-opacity="0.9" />
          </linearGradient>
          <clipPath id="pane">
            <rect x="26" y="24" width="268" height="214" rx="8" />
          </clipPath>
        </defs>

        <!-- 窗框 -->
        <rect x="8" y="6" width="304" height="252" rx="18" fill="#6B4F35" />
        <rect x="14" y="12" width="292" height="240" rx="14" fill="#573F2A" />

        <!-- 窗外夜空（裁剪在内窗内） -->
        <g clip-path="url(#pane)">
          <rect x="26" y="24" width="268" height="214" fill="url(#sky)" />
          <!-- 月牙 + 柔光 -->
          <circle class="moon-halo" cx="238" cy="66" r="26" fill="#F5E6B8" opacity="0.14" />
          <path class="moon" d="M 246 48 A 18 18 0 1 0 246 84 A 14.5 14.5 0 1 1 246 48 Z" fill="#F5E6B8" />
          <!-- 星星 -->
          <circle class="twinkle" cx="64"  cy="52" r="1.4" fill="#FFF3D6" />
          <circle class="twinkle" cx="98"  cy="86" r="1"   fill="#FFF3D6" style="animation-delay:0.7s" />
          <circle class="twinkle" cx="140" cy="44" r="1.2" fill="#FFF3D6" style="animation-delay:1.3s" />
          <circle class="twinkle" cx="178" cy="78" r="1"   fill="#FFF3D6" style="animation-delay:0.4s" />
          <circle class="twinkle" cx="212" cy="40" r="1.3" fill="#FFF3D6" style="animation-delay:1.8s" />
          <circle class="twinkle" cx="88"  cy="120" r="1"  fill="#FFF3D6" style="animation-delay:2.2s" />
          <!-- 流星（借鉴 inspira Meteors） -->
          <g class="meteor">
            <path d="M 52 42 L 22 72" stroke="url(#sky)" stroke-width="1.6" stroke-linecap="round" opacity="0" />
            <line x1="56" y1="38" x2="20" y2="74" stroke="#FFF6DE" stroke-width="1.4" stroke-linecap="round" opacity="0" />
          </g>
          <!-- 暖灯光 -->
          <rect class="warm-light" x="26" y="92" width="268" height="146" fill="url(#warm)" />
          <!-- 窗帘 -->
          <path class="curtain curtain-l" d="M 26 24 C 52 34 56 78 48 124 C 42 162 46 208 40 238 L 26 238 Z" fill="#8A5A44" opacity="0.88" />
          <path class="curtain curtain-r" d="M 294 24 C 268 34 264 78 272 124 C 278 162 274 208 280 238 L 294 238 Z" fill="#8A5A44" opacity="0.88" />
          <!-- 窗台（内沿） -->
          <rect x="26" y="218" width="268" height="20" fill="#4A3524" />
        </g>

        <!-- 窗台 -->
        <rect x="8" y="230" width="304" height="22" rx="8" fill="#6B4F35" />
        <rect x="8" y="230" width="304" height="5" rx="2" fill="#7D5D3F" />

        <!-- 猫剪影：趴着等主人（呼应"Maxma 正趴在桌上等你"） -->
        <g class="cat" fill="#2E2320">
          <ellipse cx="168" cy="212" rx="40" ry="15" />
          <circle cx="122" cy="198" r="13" />
          <path d="M 112 187 L 116 174 L 124 186 Z" />
          <path d="M 124 186 L 134 175 L 134 189 Z" />
          <!-- 尾巴（轻摆） -->
          <path class="cat-tail" d="M 204 210 C 224 208 230 194 222 184 C 216 177 206 180 208 187" fill="none" stroke="#2E2320" stroke-width="5.5" stroke-linecap="round" />
          <!-- 眼睛微光：望着窗外的月亮 -->
          <circle cx="117" cy="196" r="1.6" fill="#FFD98E" />
          <circle cx="126" cy="196" r="1.6" fill="#FFD98E" />
        </g>

        <!-- 「玛」字朱砂印（品牌落款，贴在窗内右上角） -->
        <g class="seal-stamp">
          <rect x="226" y="34" width="32" height="32" rx="6" fill="#C23B22" />
          <text x="242" y="57" font-family="'Songti SC','STSong','Noto Serif SC',serif" font-size="17" font-weight="700" fill="#FBF7F0" text-anchor="middle">玛</text>
        </g>
      </svg>

      <div class="boot-bar" aria-hidden="true"><span></span></div>
      <p class="boot-status"><span id="boot-status-text">正在点亮小公寓的灯</span><span class="boot-dots"><i>·</i><i>·</i><i>·</i></span></p>
      <p class="boot-hint">首次启动需要 10–30 秒</p>
    </div>
    <style>
      #app-loading {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(ellipse 90% 70% at 50% 36%, #FAF6EF 0%, #F4EFE6 55%, #EDE7DC 100%);
        font-family: 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', serif;
        overflow: hidden;
      }
      /* 宣纸颗粒质感 */
      #app-loading::before {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background-image:
          radial-gradient(rgba(28, 28, 28, 0.028) 1px, transparent 1px),
          radial-gradient(rgba(28, 28, 28, 0.018) 1px, transparent 1px);
        background-size: 5px 5px, 9px 9px;
        background-position: 0 0, 3px 3px;
      }
      /* 顶部朱砂细线（品牌点睛） */
      #app-loading::after {
        content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
        width: 64px; height: 3px; border-radius: 0 0 2px 2px;
        background: linear-gradient(90deg, transparent, #C23B22 30%, #C23B22 70%, transparent);
        opacity: 0.85;
      }

      /* ── Aurora 暖色光斑（借鉴 inspira AuroraBackground） ── */
      .boot-aurora {
        position: absolute; inset: 0; pointer-events: none; overflow: hidden;
        mask-image: radial-gradient(ellipse 85% 65% at 50% 42%, black 25%, transparent 72%);
        -webkit-mask-image: radial-gradient(ellipse 85% 65% at 50% 42%, black 25%, transparent 72%);
      }
      .aurora-beam {
        position: absolute; border-radius: 50%;
        filter: blur(72px);
        will-change: transform, opacity;
        animation: aurora-float 13s ease-in-out infinite;
      }
      .beam-1 { width: 340px; height: 260px; top: 12%; left: 8%;  background: #E8C39A; opacity: 0.5; }
      .beam-2 { width: 300px; height: 240px; top: 40%; left: 62%; background: #D9A37B; opacity: 0.42; animation-delay: -4s; animation-duration: 16s; }
      .beam-3 { width: 260px; height: 220px; top: 58%; left: 26%; background: #C23B22; opacity: 0.16; animation-delay: -8s; animation-duration: 19s; }
      @keyframes aurora-float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        25%      { transform: translate(34px, -22px) scale(1.14); }
        50%      { transform: translate(-22px, 18px) scale(0.92); }
        75%      { transform: translate(42px, -12px) scale(1.08); }
      }

      /* ── 玛字朱砂印 ── */
      .boot-seal-wrap {
        margin-bottom: 14px;
        animation: boot-seal-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .boot-seal {
        width: 46px; height: 46px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(145deg, #D24830 0%, #C23B22 55%, #A9321C 100%);
        color: #FBF7F0;
        font-size: 23px; font-weight: 700; line-height: 1;
        border-radius: 9px;
        box-shadow:
          0 2px 10px rgba(194, 59, 34, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.2),
          inset 0 -2px 4px rgba(120, 25, 10, 0.25);
        animation: boot-breathe 3s cubic-bezier(0.37, 0, 0.63, 1) 0.6s infinite;
      }
      .boot-title {
        margin: 0 0 4px; font-size: 22px; font-weight: 900;
        letter-spacing: 3px; color: #1C1C1C;
        animation: boot-fade-up 0.8s ease-out 0.1s both;
      }
      .boot-slogan {
        margin: 0 0 18px; font-size: 12px; letter-spacing: 4px;
        color: #A49A8C;
        animation: boot-fade-up 0.8s ease-out 0.2s both;
      }

      /* ── 小公寓的窗（SVG 插画） ── */
      .boot-window {
        width: 264px; height: auto; margin-bottom: 20px;
        filter: drop-shadow(0 14px 26px rgba(60, 42, 28, 0.22));
        animation: boot-window-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
      }
      .boot-window .twinkle   { animation: twinkle 2.6s ease-in-out infinite; }
      .boot-window .moon      { animation: moon-glow 4.5s ease-in-out infinite; transform-origin: 246px 66px; }
      .boot-window .moon-halo { animation: moon-glow 4.5s ease-in-out infinite; transform-origin: 238px 66px; }
      .boot-window .meteor    { animation: meteor-fall 7.5s linear 2.5s infinite; }
      .boot-window .warm-light{ animation: light-breathe 3.4s ease-in-out infinite; }
      .boot-window .curtain-l { transform-origin: 26px 24px; animation: curtain-sway 6s ease-in-out infinite; }
      .boot-window .curtain-r { transform-origin: 294px 24px; animation: curtain-sway 6s ease-in-out 3s infinite; }
      .boot-window .cat-tail  { transform-origin: 204px 210px; animation: tail-sway 3.2s ease-in-out infinite; }
      .boot-window .seal-stamp{ animation: stamp-in 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.9s both; }

      /* ── 进度条 ── */
      .boot-bar {
        width: 140px; height: 2px; margin-bottom: 16px;
        border-radius: 999px; background: rgba(28, 28, 28, 0.09);
        overflow: hidden;
      }
      .boot-bar span {
        display: block; width: 38%; height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(194,59,34,0.55), #C23B22, rgba(194,59,34,0.55));
        animation: boot-slide 1.5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .boot-status {
        margin: 0; font-size: 13px; color: #6E6E6E; letter-spacing: 1px;
      }
      .boot-dots i {
        font-style: normal;
        animation: boot-dot 1.4s ease-in-out infinite;
      }
      .boot-dots i:nth-child(2) { animation-delay: 0.2s; }
      .boot-dots i:nth-child(3) { animation-delay: 0.4s; }
      .boot-hint {
        margin: 12px 0 0; font-size: 11px; color: #B0A898; letter-spacing: 0.5px;
      }

      @keyframes boot-seal-in {
        from { opacity: 0; transform: scale(0.55) rotate(-8deg); }
        to   { opacity: 1; transform: scale(1) rotate(0deg); }
      }
      @keyframes boot-breathe {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.05); }
      }
      @keyframes boot-fade-up {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes boot-window-in {
        from { opacity: 0; transform: translateY(14px) scale(0.97); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes boot-slide {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(360%); }
      }
      @keyframes boot-dot {
        0%, 100% { opacity: 0.25; } 50% { opacity: 1; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.25; }
        50%      { opacity: 1; }
      }
      @keyframes moon-glow {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50%      { opacity: 1; transform: scale(1.05); }
      }
      @keyframes meteor-fall {
        0%   { opacity: 0; transform: translate(0, 0); }
        3%   { opacity: 1; }
        14%  { opacity: 0; transform: translate(-34px, 34px); }
        100% { opacity: 0; transform: translate(-34px, 34px); }
      }
      @keyframes light-breathe {
        0%, 100% { opacity: 0.86; }
        50%      { opacity: 1; }
      }
      @keyframes curtain-sway {
        0%, 100% { transform: rotate(0deg); }
        50%      { transform: rotate(1.4deg); }
      }
      @keyframes tail-sway {
        0%, 100% { transform: rotate(0deg); }
        50%      { transform: rotate(7deg); }
      }
      @keyframes stamp-in {
        from { opacity: 0; transform: scale(0.4) rotate(-14deg); }
        to   { opacity: 1; transform: scale(1) rotate(0deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loading .aurora-beam,
        #app-loading .boot-seal-wrap,
        #app-loading .boot-seal,
        #app-loading .boot-window,
        #app-loading .boot-bar span,
        #app-loading .boot-dots i,
        #app-loading .boot-title,
        #app-loading .boot-slogan,
        #app-loading .boot-window * { animation: none !important; opacity: 1 !important; }
      }
    </style>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
