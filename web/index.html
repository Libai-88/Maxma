<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/brand/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Maxma — AI agent workspace" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:* ws://127.0.0.1:* http://127.0.0.1:*; img-src 'self' https: http://localhost:* http://127.0.0.1:* data: blob:; frame-src 'self';" />
    <title>Maxma</title>
    <style>
      html { background: oklch(0.16 0 0); color-scheme: dark; }
      #app-loading {
        position: fixed; inset: 0; z-index: 9999; display: flex;
        align-items: center; justify-content: center;
        font-family: 'Geist Variable', ui-sans-serif, system-ui, sans-serif;
        background: oklch(0.16 0 0);
      }
      .boot-pane {
        width: min(360px, calc(100vw - 48px)); padding: 28px 30px;
        border-radius: 14px; text-align: center;
        background: oklch(0.985 0.003 265 / 6%);
        border: 1px solid oklch(1 0 0 / 10%);
        box-shadow: inset 0 1px 0 oklch(1 0 0 / 14%), 0 12px 40px oklch(0 0 0 / 40%);
        color: oklch(0.985 0 0 / 92%);
      }
      .boot-title { margin: 0 0 6px; font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
      .boot-slogan { margin: 0 0 22px; font-size: 12px; color: oklch(0.985 0 0 / 55%); letter-spacing: 0.08em; }
      .boot-bar { height: 2px; border-radius: 999px; background: oklch(1 0 0 / 12%); overflow: hidden; }
      .boot-bar span {
        display: block; width: 38%; height: 100%; border-radius: 999px;
        background: oklch(0.9 0 0 / 70%);
        animation: boot-slide 1.5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .boot-status { margin: 16px 0 0; font-size: 12px; color: oklch(0.985 0 0 / 60%); }
      .boot-hint { margin: 8px 0 0; font-size: 11px; color: oklch(0.985 0 0 / 35%); }
      @keyframes boot-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(360%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar span { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <noscript>请启用 JavaScript 以使用 Maxma。</noscript>
    <div id="app-loading" role="status" aria-label="正在启动">
      <div class="boot-pane">
        <p class="boot-title">Maxma</p>
        <p class="boot-slogan">Agent workspace</p>
        <div class="boot-bar"><span></span></div>
        <p class="boot-status"><span id="boot-status-text">正在连接后端服务</span></p>
        <p class="boot-hint">首次启动可能需要 10–30 秒</p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
